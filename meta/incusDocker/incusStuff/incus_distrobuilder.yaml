image:
  distribution: ubuntu
  release: resolute
  description: Ubuntu 26.04 LTS with Kubernetes v1.33
  architecture: x86_64
  expiry: 30d

source:
  downloader: debootstrap
  same_as: gutsy
  url: http://archive.ubuntu.com/ubuntu/
  keyserver: keyserver.ubuntu.com
  keys:
    - 0x790BC7277767219C42C86F933B4FE6ACC0B21F32
    - 0xf6ecb3762474eda9d21b7022871920d1991bc93c

files:
  - path: /etc/hostname
    generator: hostname
  - path: /etc/hosts
    generator: hosts
  - path: /etc/machine-id
    generator: dump
    content: uninitialized
  - path: /var/lib/dbus/machine-id
    generator: remove

  - path: /etc/netplan/10-incus.yaml
    generator: dump
    mode: 0600
    content: |-
      network:
        version: 2
        ethernets:
          enp5s0:
            dhcp4: true
            dhcp-identifier: mac
    types: [vm]

  - path: /etc/sysctl.d/99-kubernetes.conf
    generator: dump
    mode: 0644
    content: |-
      net.bridge.bridge-nf-call-iptables = 1
      net.bridge.bridge-nf-call-ip6tables = 1
      net.ipv4.ip_forward = 1
    types: [vm]

  - name: meta-data
    generator: cloud-init
  - name: network-config
    generator: cloud-init
  - name: user-data
    generator: cloud-init
  - name: vendor-data
    generator: cloud-init

  - name: ext4
    generator: fstab
    types: [vm]

  - name: incus-agent
    generator: incus-agent
    types: [vm]

  - path: /etc/default/grub.d/50-incus.cfg
    generator: dump
    content: |-
      GRUB_RECORDFAIL_TIMEOUT=0
      GRUB_TIMEOUT=0
      GRUB_CMDLINE_LINUX_DEFAULT="${GRUB_CMDLINE_LINUX_DEFAULT} console=tty1 console=ttyS0"
      GRUB_TERMINAL=console
    types: [vm]

  - path: /etc/sudoers.d/90-incus
    generator: dump
    mode: 0440
    content: |-
      ubuntu ALL=(ALL) NOPASSWD:ALL

  # The ubuntu user has no password baked into the image — one is set
  # randomly per-VM at provisioning time (see be/internal/jobs/node.go) and
  # shown to the owner from the UI. Explicit rather than relying on
  # whatever openssh-server's packaged default happens to be, since the
  # whole feature depends on password auth actually being allowed.
  - path: /etc/ssh/sshd_config.d/60-incus-password-auth.conf
    generator: dump
    mode: 0644
    content: |-
      PasswordAuthentication yes

packages:
  manager: apt
  update: true
  cleanup: true
  sets:
    - packages:
        - curl
        - openssh-client
        - openssh-server
        - sudo
        - vim
        - ca-certificates
        - gpg
        - language-pack-en
        - containerd
        - systemd-resolved
        - systemd-timesyncd
        - cloud-init
        - fuse3
      action: install

    - packages:
        - kubelet
        - kubeadm
        - kubectl
      action: install

    - packages:
        - grub-efi-amd64-signed
        - shim-signed
        - linux-image-virtual
        - cloud-guest-utils
      action: install
      architectures: [amd64]
      types: [vm]

    - packages:
        - os-prober
      action: remove
      types: [vm]

  repositories:
    - name: sources.list
      url: |-
        deb http://archive.ubuntu.com/ubuntu {{ image.release }} main restricted universe multiverse
        deb http://archive.ubuntu.com/ubuntu {{ image.release }}-updates main restricted universe multiverse
        deb http://security.ubuntu.com/ubuntu {{ image.release }}-security main restricted universe multiverse

actions:
  - trigger: post-unpack
    action: |-
      #!/bin/sh
      set -eux

      [ ! -d /run/systemd ] && exit 0
      rm -Rf /run/systemd/system
      chattr +i /run/systemd

  - trigger: post-unpack
    action: |-
      #!/bin/sh
      set -eux

      apt-get update
      apt-get install -y --no-install-recommends curl ca-certificates gnupg
      mkdir -p /etc/apt/keyrings
      curl -fsSL https://pkgs.k8s.io/core:/stable:/v1.33/deb/Release.key \
        | gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg

      cat > /etc/apt/sources.list.d/kubernetes.list <<'EOF'
      deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v1.33/deb/ /
      EOF

  - trigger: post-packages
    action: |-
      #!/bin/sh
      set -eux

      # Pre-pull the control-plane images kubeadm needs (apiserver,
      # controller-manager, scheduler, proxy, pause, etcd, coredns) for the
      # pinned Kubernetes version, so `kubeadm init`/`kubeadm join` never
      # pulls them over the network at cluster-creation time. Runs before
      # the /etc/resolv.conf rewrite further down (which points at the
      # booted VM's systemd-resolved stub — not usable inside this chroot),
      # so DNS still works here. Uses a throwaway containerd config so this
      # doesn't depend on /etc/containerd/config.toml existing yet, but its
      # default root/state dirs (/var/lib/containerd, /run/containerd) are
      # the same ones the real system uses, so the pulled images land in
      # the final image.
      containerd config default > /tmp/containerd-image-prepull.toml
      containerd --config /tmp/containerd-image-prepull.toml &
      CONTAINERD_PID=$!

      for i in $(seq 1 30); do
        [ -S /run/containerd/containerd.sock ] && break
        sleep 1
      done
      [ -S /run/containerd/containerd.sock ]

      kubeadm config images pull

      kill "$CONTAINERD_PID"
      wait "$CONTAINERD_PID" 2>/dev/null || true
      rm -rf /run/containerd /tmp/containerd-image-prepull.toml

  - trigger: post-packages
    action: |-
      #!/bin/sh
      set -eux

      [ ! -d /run/systemd ] && exit 0
      chattr -i /run/systemd

      mkdir -p /etc/containerd
      containerd config default > /etc/containerd/config.toml
      sed -i 's/SystemdCgroup = false/SystemdCgroup = true/' /etc/containerd/config.toml

      cat > /etc/modules-load.d/k8s.conf <<'EOF'
      overlay
      br_netfilter
      EOF

      systemctl mask swap.target
      apt-mark hold kubelet kubeadm kubectl
      systemctl enable kubelet systemd-networkd ssh
      systemctl mask ua-auto-attach

      umount -l /etc/resolv.conf || true
      rm -f /etc/resolv.conf
      ln -sf ../run/systemd/resolve/stub-resolv.conf /etc/resolv.conf

      locale-gen en_US.UTF-8
      update-locale LANG=en_US.UTF-8

      mount -o bind / /mnt
      rm -rf /mnt/run/*
      umount /mnt
      rm -f /etc/*-

  - trigger: post-packages
    action: |-
      #!/bin/sh
      set -eux

      getent group sudo >/dev/null 2>&1 || groupadd --system sudo
      useradd --create-home -s /bin/bash -G sudo -U ubuntu

  - trigger: post-files
    action: |-
      #!/bin/sh
      set -eux

      TARGET="x86_64"
      [ "$(uname -m)" = "aarch64" ] && TARGET="arm64"

      mkdir -p /etc/initramfs-tools/conf.d
      printf 'RESUME=none\n' > /etc/initramfs-tools/conf.d/resume
      update-initramfs -u -k all

      update-grub
      grub-install --uefi-secure-boot --target="${TARGET}-efi" --no-nvram --removable
      grub-install --uefi-secure-boot --target="${TARGET}-efi" --no-nvram
      update-grub
      sed -i "s#root=[^ ]*#root=${DISTROBUILDER_ROOT_UUID}#g" /boot/grub/grub.cfg

      cat > /etc/systemd/system/incus-growpart.service <<'EOF'
      [Unit]
      Description=Incus - grow root partition
      ConditionPathExists=/usr/bin/growpart
      ConditionPathExists=/sbin/resize2fs

      [Service]
      Type=oneshot
      ExecStartPre=-/usr/bin/growpart /dev/sda 2
      ExecStart=/sbin/resize2fs /dev/sda2

      [Install]
      WantedBy=default.target
      EOF

      systemctl enable incus-growpart
    types: [vm]

mappings:
  architecture_map: debian
